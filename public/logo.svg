<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="55%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="45%" stop-color="#ffc233"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark badge with subtle vertical highlight -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9"/>

  <!-- Neural network forming a brain silhouette -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-width="5" opacity="0.55">
    <!-- Left hemisphere web -->
    <path d="M186 196 L214 178 L252 184 L186 196 L168 232 L204 226 L252 214 L168 232 L160 272 L198 264 L242 256 L198 264 L184 306 L222 300 L252 288 L222 300"/>
    <path d="M214 178 L256 168"/>
    <!-- Right hemisphere web (mirror) -->
    <path d="M326 196 L298 178 L260 184 L326 196 L344 232 L308 226 L260 214 L344 232 L352 272 L314 264 L270 256 L314 264 L328 306 L290 300 L260 288 L290 300"/>
    <path d="M298 178 L256 168"/>
    <!-- Cross-links between hemispheres -->
    <path d="M214 178 C236 214 276 214 298 178"/>
    <path d="M186 196 C226 238 286 238 326 196" stroke-width="3"/>
    <path d="M184 306 C226 288 286 288 328 306" stroke-width="3"/>
    <!-- Brainstem -->
    <path d="M256 288 L244 330 L256 360 L268 330 Z" stroke-width="4"/>
  </g>

  <!-- Brain contour outline -->
  <path d="M256 150 C 292 150 318 166 330 192 C 348 180 366 194 372 214 C 380 240 362 252 348 250 C 352 270 338 292 314 296 C 310 322 288 344 262 344 C 256 348 248 348 242 344 C 216 344 194 322 190 296 C 166 292 152 270 156 250 C 142 252 124 240 132 214 C 138 194 156 180 174 192 C 186 166 220 150 256 150 Z"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round" filter="url(#glow)" opacity="0.95"/>

  <!-- Inner gyri folds -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-width="4" opacity="0.5">
    <path d="M196 196 C204 210 198 222 188 228"/>
    <path d="M316 196 C308 210 314 222 324 228"/>
    <path d="M214 176 C206 164 212 152 224 152"/>
    <path d="M298 176 C306 164 300 152 288 152"/>
  </g>

  <!-- Glowing synapse nodes -->
  <g fill="url(#gold)" filter="url(#glow)">
    <circle cx="256" cy="168" r="9"/>
    <circle cx="256" cy="288" r="8"/>
    <circle cx="252" cy="196" r="7"/>
    <circle cx="198" cy="230" r="6"/>
    <circle cx="314" cy="230" r="6"/>
    <circle cx="176" cy="268" r="6"/>
    <circle cx="336" cy="268" r="6"/>
    <circle cx="218" cy="304" r="6"/>
    <circle cx="294" cy="304" r="6"/>
  </g>

  <!-- Lightning bolt (Habit OS energy) -->
  <path d="M270 356 L232 396 L254 396 L242 434 L288 392 L262 392 Z"
        fill="url(#gold)" filter="url(#soft)"/>
</svg>
